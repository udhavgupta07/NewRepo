<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Red Light, Green Light — Code Art Attack</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:'Courier New',monospace}
  canvas{display:block;margin:0 auto;background:#0a0a0a;box-shadow:0 0 40px #ff0055}
  #hud{position:fixed;top:8px;left:12px;color:#ff2e63;font-size:14px;letter-spacing:2px;text-shadow:0 0 8px #ff2e63}
</style>
</head>
<body>
<div id="hud">○ △ □  RED LIGHT · GREEN LIGHT  □ △ ○</div>
<canvas id="c" width="900" height="600"></canvas>

<script>
/* ============================================================
   CODE ART ATTACK — SQUID GAME
   "Red Light, Green Light" — animated canvas artwork
   Pure JavaScript + Canvas, no external assets
   ============================================================ */

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;

// ---------- helpers ----------
const rnd = (a,b)=>a+Math.random()*(b-a);
const TAU = Math.PI*2;

// ---------- state ----------
let t = 0;
let lightPhase = 'green';   // 'green' | 'red'
let phaseTimer = 0;
let dollAngle = 0;          // 0 = facing away, PI = facing players
let targetAngle = 0;

// players
const players = [];
for (let i=0;i<9;i++){
  players.push({
    x: 120 + i*90 + rnd(-15,15),
    y: H-70 + rnd(-8,8),
    alive: true,
    fallT: 0,
    hue: 120 + rnd(-10,10),
    speed: rnd(0.4,1.1)
  });
}

// floating squid symbols
const symbols = [];
const shapes = ['circle','triangle','square'];
for (let i=0;i<18;i++){
  symbols.push({
    x: rnd(0,W), y: rnd(0,H),
    s: rnd(14,34),
    shape: shapes[i%3],
    rot: rnd(0,TAU),
    vr: rnd(-0.01,0.01),
    vy: rnd(-0.4,-0.1),
    a: rnd(0.15,0.5)
  });
}

// ---------- draw functions ----------
function drawBackground(){
  // dark gradient + subtle vignette
  const g = ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,W*0.75);
  g.addColorStop(0,'#141018');
  g.addColorStop(1,'#050308');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // floor line
  ctx.strokeStyle = 'rgba(255,46,99,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0,H-40); ctx.lineTo(W,H-40);
  ctx.stroke();

  // scanlines
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for (let y=0;y<H;y+=4) ctx.fillRect(0,y,W,1);
}

function drawSquidSymbol(x,y,s,shape,rot,alpha,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, s*0.12);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (shape==='circle'){
    ctx.arc(0,0,s*0.55,0,TAU);
  } else if (shape==='triangle'){
    ctx.moveTo(0,-s*0.6);
    ctx.lineTo(s*0.55,s*0.45);
    ctx.lineTo(-s*0.55,s*0.45);
    ctx.closePath();
  } else {
    ctx.rect(-s*0.45,-s*0.45,s*0.9,s*0.9);
  }
  ctx.stroke();
  ctx.restore();
}

function drawSymbols(){
  for (const sy of symbols){
    const color = sy.shape==='circle' ? '#ff2e63'
                 : sy.shape==='triangle' ? '#00e5ff' : '#ffd166';
    drawSquidSymbol(sy.x, sy.y, sy.s, sy.shape, sy.rot, sy.a, color);
  }
}

function drawDoll(){
  const cx = W/2, cy = 210;
  // head tilt interpolated
  const tilt = dollAngle;

  // glow behind doll
  const glow = ctx.createRadialGradient(cx,cy,10,cx,cy,180);
  glow.addColorStop(0,'rgba(255,46,99,0.35)');
  glow.addColorStop(1,'rgba(255,46,99,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx,cy,180,0,TAU); ctx.fill();

  // body
  ctx.save();
  ctx.translate(cx,cy);

  // dress
  ctx.fillStyle = '#ffb703';
  ctx.beginPath();
  ctx.moveTo(-55,120);
  ctx.lineTo(55,120);
  ctx.lineTo(30,10);
  ctx.lineTo(-30,10);
  ctx.closePath();
  ctx.fill();

  // arms
  ctx.strokeStyle = '#ffb703';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-30,40); ctx.lineTo(-85,90);
  ctx.moveTo(30,40);  ctx.lineTo(85,90);
  ctx.stroke();

  // head (rotates)
  ctx.save();
  ctx.rotate(tilt);
  // hair
  ctx.fillStyle = '#2b1b12';
  ctx.beginPath(); ctx.arc(0,-45,52,0,TAU); ctx.fill();
  // face
  ctx.fillStyle = '#f6d7b0';
  ctx.beginPath(); ctx.arc(0,-40,44,0,TAU); ctx.fill();
  // eyes (glowing when red light)
  ctx.fillStyle = lightPhase==='red' ? '#ff0033' : '#1a1a1a';
  ctx.beginPath(); ctx.arc(-16,-48,6,0,TAU); ctx.arc(16,-48,6,0,TAU); ctx.fill();
  if (lightPhase==='red'){
    ctx.shadowColor='#ff0033'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(-16,-48,6,0,TAU); ctx.arc(16,-48,6,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }
  // mouth
  ctx.strokeStyle='#a33'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,-30,10,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  // hair bow
  ctx.fillStyle='#ff2e63';
  ctx.beginPath();
  ctx.moveTo(-30,-85); ctx.lineTo(-10,-70); ctx.lineTo(-30,-55); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(30,-85); ctx.lineTo(10,-70); ctx.lineTo(30,-55); ctx.closePath(); ctx.fill();
  ctx.restore();

  // legs
  ctx.strokeStyle='#ffb703'; ctx.lineWidth=14;
  ctx.beginPath(); ctx.moveTo(-18,120); ctx.lineTo(-28,175);
  ctx.moveTo(18,120); ctx.lineTo(28,175); ctx.stroke();

  ctx.restore();
}

function drawGuard(x,y,scale,shape){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  // body (pink suit)
  ctx.fillStyle = '#ff2e63';
  ctx.beginPath();
  ctx.moveTo(-16,60); ctx.lineTo(16,60);
  ctx.lineTo(12,10); ctx.lineTo(-12,10); ctx.closePath(); ctx.fill();
  // arms
  ctx.strokeStyle='#ff2e63'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-12,20); ctx.lineTo(-26,45);
  ctx.moveTo(12,20);  ctx.lineTo(26,45);
  ctx.stroke();
  // legs
  ctx.beginPath();
  ctx.moveTo(-8,60); ctx.lineTo(-10,90);
  ctx.moveTo(8,60);  ctx.lineTo(10,90);
  ctx.stroke();

  // mask
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(0,0,20,0,TAU); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,20,0,TAU); ctx.stroke();

  // mask symbol
  ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineJoin='round';
  ctx.beginPath();
  if (shape==='circle'){
    ctx.arc(0,0,9,0,TAU);
  } else if (shape==='triangle'){
    ctx.moveTo(0,-10); ctx.lineTo(9,8); ctx.lineTo(-9,8); ctx.closePath();
  } else {
    ctx.rect(-8,-8,16,16);
  }
  ctx.stroke();
  ctx.restore();
}

function drawPlayers(){
  for (const p of players){
    ctx.save();
    ctx.translate(p.x,p.y);
    if (!p.alive){
      // fallen (eliminated)
      ctx.rotate(Math.PI/2);
      ctx.globalAlpha = 0.6;
    }
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0,14,16,5,0,0,TAU); ctx.fill();

    // tracksuit body
    ctx.fillStyle = `hsl(${p.hue},60%,38%)`;
    ctx.beginPath();
    ctx.moveTo(-10,10); ctx.lineTo(10,10);
    ctx.lineTo(8,-18); ctx.lineTo(-8,-18); ctx.closePath(); ctx.fill();
    // white stripe
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(0,10); ctx.stroke();
    // head
    ctx.fillStyle='#f6d7b0';
    ctx.beginPath(); ctx.arc(0,-26,9,0,TAU); ctx.fill();
    // hair
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath(); ctx.arc(0,-29,9,Math.PI,TAU); ctx.fill();
    // legs
    ctx.strokeStyle=`hsl(${p.hue},60%,30%)`; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-4,10); ctx.lineTo(-6,22);
    ctx.moveTo(4,10);  ctx.lineTo(6,22);
    ctx.stroke();
    // number
    ctx.fillStyle='#fff'; ctx.font='bold 8px Courier New'; ctx.textAlign='center';
    ctx.fillText(String(100+Math.floor(p.x)%200), 0, 0);
    ctx.restore();
  }
}

function drawTimer(){
  // countdown derived from t
  const total = 180; // 3 min
  const remaining = Math.max(0, total - t);
  const m = String(Math.floor(remaining/60)).padStart(2,'0');
  const s = String(Math.floor(remaining%60)).padStart(2,'0');

  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold 34px Courier New';
  ctx.fillStyle='#fff';
  ctx.shadowColor='#ff2e63'; ctx.shadowBlur=20;
  ctx.fillText(`${m}:${s}`, W/2, 60);
  ctx.shadowBlur=0;

  // phase label
  ctx.font='bold 18px Courier New';
  ctx.fillStyle = lightPhase==='red' ? '#ff0033' : '#00ff9d';
  ctx.fillText(lightPhase==='red' ? '● RED LIGHT' : '● GREEN LIGHT', W/2, 90);
  ctx.restore();
}

function drawGuards(){
  drawGuard(120, H-140, 1.1, 'circle');
  drawGuard(W-120, H-140, 1.1, 'triangle');
  drawGuard(240, H-160, 0.9, 'square');
  drawGuard(W-240, H-160, 0.9, 'circle');
}

// ---------- update ----------
function update(dt){
  t += dt;
  phaseTimer += dt;

  // phase switching every 4s
  if (phaseTimer > 4){
    phaseTimer = 0;
    lightPhase = lightPhase==='green' ? 'red' : 'green';
    targetAngle = lightPhase==='red' ? Math.PI : 0;
  }

  // rotate doll smoothly
  dollAngle += (targetAngle - dollAngle) * Math.min(1, dt*4);

  // players move toward doll on green light
  for (const p of players){
    if (!p.alive) continue;
    if (lightPhase==='green'){
      p.y -= p.speed * dt * 8;
      if (p.y < 260) { /* reached */ }
    } else {
      // random elimination when red
      if (Math.random() < 0.008){
        p.alive = false;
      }
    }
  }

  // symbols drift
  for (const sy of symbols){
    sy.y += sy.vy;
    sy.rot += sy.vr;
    if (sy.y < -60){ sy.y = H+60; sy.x = rnd(0,W); }
  }
}

// ---------- main loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;

  update(dt);

  // background & scene
  drawBackground();
  drawSymbols();
  drawDoll();
  drawGuards();
  drawPlayers();
  drawTimer();

  // red light overlay
  if (lightPhase==='red'){
    ctx.fillStyle='rgba(255,0,40,0.08)';
    ctx.fillRect(0,0,W,H);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
